# Render Blueprint for Codeforces Scraper Service
# Deploy via: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: codeforces-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 3001
      - key: SCRAPER_API_KEY
        generateValue: true
    healthCheckPath: /health
    plan: starter  # $7/month - needed for Playwright/Chromium
